<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Δήλωση Διαθεσιμότητας - ΕΟΔΑ</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: white; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 450px; width: 100%; border: 1px solid #334155; }
        h2 { color: #38bdf8; text-align: center; margin-top: 0; }
        label { display: block; margin-top: 12px; color: #94a3b8; font-size: 0.85rem; }
        input { width: 100%; padding: 12px; margin-top: 4px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; text-transform: uppercase; }
        button { width: 100%; margin-top: 18px; padding: 14px; background: #16a34a; border: none; color: white; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #334155; font-size: 0.9rem; }
        th { color: #94a3b8; }
        .badge { color: #4ade80; background: rgba(22, 163, 74, 0.2); padding: 4px 8px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="card">
    <h2>📋 Δήλωση Διαθεσιμότητας</h2>
    
    <label>Ονοματεπώνυμο & Κλητικό (ΚΕΦΑΛΑΙΑ)</label>
    <input type="text" id="name" placeholder="π.χ. ΑΝΕΣΤΗΣ ΘΕΟΔΩΡΙΔΗΣ (352)">
    
    <label>Ώρες Διαθεσιμότητας (Από - Έως)</label>
    <input type="text" id="hours" placeholder="π.χ. 17:00 - 22:00">

    <button onclick="add()">➕ Προσθήκη στη Λίστα</button>

    <h3 style="margin-top:25px; color:#38bdf8;">👥 Διαθέσιμα Στελέχη</h3>
    <table>
        <thead>
            <tr>
                <th>Στέλεχος</th>
                <th style="text-align:right;">Ώρες</th>
            </tr>
        </thead>
        <tbody id="list">
            <tr><td colspan="2" style="text-align:center; color:#94a3b8;">Καμία συμμετοχή ακόμα</td></tr>
        </tbody>
    </table>
</div>

<script>
    let data = [];
    function add() {
        const n = document.getElementById('name').value.trim().toUpperCase();
        const h = document.getElementById('hours').value.trim();
        if(!n || !h) return alert('Συμπληρώστε όλα τα πεδία');
        
        data.push({ name: n, hours: h });
        document.getElementById('name').value = '';
        document.getElementById('hours').value = '';
        
        const tbody = document.getElementById('list');
        tbody.innerHTML = data.map(i => `
            <tr>
                <td><strong>${i.name}</strong></td>
                <td style="text-align:right;"><span class="badge">${i.hours}</span></td>
            </tr>
        `).join('');
    }
</script>

</body>
</html>
